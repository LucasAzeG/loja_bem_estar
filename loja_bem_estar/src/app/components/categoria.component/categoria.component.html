<div class="lista-container">
    <header class="header-container">
      <div>
        <h1>Categorias de Serviços</h1>
        <p>Gerenciamento do catálogo de categorias</p>
      </div>
      <div class="acoes-header">
        <button routerLink="/categorias/novo" class="btn-novo">+ Nova Categoria</button>
        <button routerLink="/" class="btn-voltar">Home</button>
      </div>
    </header>
  
    <div class="tabela-wrapper">
      <table class="tabela-categorias">
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th>Nome da Categoria</th>
            <th class="col-acoes">Ações</th>
          </tr>
        </thead>
        <tbody>
          @for (item of categoriaService.categorias(); track item.idcategoria) {
            <tr>
              <td class="col-id">#{{ item.idcategoria }}</td>
              <td class="col-nome">{{ item.categoria }}</td>
              <td class="col-acoes">
                <button [routerLink]="['/categorias/editar', item.idcategoria]" class="btn-editar">
                  Editar
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="sem-dados">Nenhuma categoria cadastrada até o momento.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
