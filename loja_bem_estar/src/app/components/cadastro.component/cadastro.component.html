<div class="cadastro-container">
  <header class="header-container">
    <div>
      <h1>{{ isEdicao ? 'Editar Cliente' : 'Novo Cliente' }}</h1>
      <p>Preencha os dados abaixo para {{ isEdicao ? 'atualizar' : 'cadastrar' }} a pessoa</p>
    </div>
    <div class="acoes-header">
      <button routerLink="/" class="btn-home">Home</button>
    </div>
  </header>

  <!-- Banner de Feedback Sucesso -->
  @if (mensagemSucesso) {
    <div class="mensagem-sucesso">
      <span>✨ {{ mensagemSucesso }}</span>
    </div>
  }

  <!-- Banner de Feedback Erro -->
  @if (mensagemErro) {
    <div class="mensagem-erro">
      <span>⚠️ {{ mensagemErro }}</span>
    </div>
  }

  <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()" class="form-cadastro">
    <div class="form-group">
      <label for="nome">Nome Completo</label>
      <input id="nome" type="text" formControlName="nome" placeholder="Digite o nome completo" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="cpf">CPF (Apenas números)</label>
        <input id="cpf" type="text" formControlName="cpf" placeholder="00000000000" />
      </div>

      <div class="form-group">
        <label for="dataNascimento">Data de Nascimento</label>
        <input id="dataNascimento" type="date" formControlName="dataNascimento" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="sexo">Sexo</label>
        <select id="sexo" formControlName="sexo">
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
        </select>
      </div>

      <div class="form-group">
        <label for="ativoPessoa">Status</label>
        <select id="ativoPessoa" formControlName="ativoPessoa">
          <option value="S">Ativo</option>
          <option value="N">Inativo</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" placeholder="exemplo@email.com" />
      </div>

      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input id="telefone" type="text" formControlName="telefone" placeholder="11999998888" />
      </div>
    </div>

    <div class="botoes-form">
      <button type="submit" [disabled]="cadastroForm.invalid" class="btn-salvar">
        Salvar
      </button>

      <button type="button" routerLink="/clientes" class="btn-cancelar">
        Cancelar
      </button>

      @if (isEdicao) {
        <button type="button" (click)="excluirCliente()" class="btn-excluir">
          Excluir
        </button>
      }
    </div>
  </form>
</div>
