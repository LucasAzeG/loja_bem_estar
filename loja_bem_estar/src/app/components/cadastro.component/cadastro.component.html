<div class="cadastro-container">
    <header class="header-container">
      <h1>Cadastro de Clientes</h1>
      <div class="acoes-header">
        <button routerLink="/clientes" class="btn-lista">Ver Clientes</button>
        <button routerLink="/" class="btn-voltar">Voltar para Home</button>
      </div>
    </header>
  
    <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()" class="form-cadastro">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input id="nome" type="text" formControlName="nome" placeholder="Digite o nome completo" />
      </div>
  
      <div class="form-row">
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input 
            id="cpf" 
            type="text" 
            formControlName="cpf" 
            maxlength="11" 
            placeholder="Somente 11 números" 
          />
        </div>
  
        <div class="form-group">
          <label for="data_nascimento">Data de Nascimento</label>
          <input id="data_nascimento" type="date" formControlName="data_nascimento" />
        </div>
      </div>
  
      <div class="form-row">
        <div class="form-group">
          <label for="sexo">Sexo</label>
          <select id="sexo" formControlName="sexo">
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
            <option value="O">Outro</option>
          </select>
        </div>
  
        <div class="form-group">
          <label for="ativo_pessoa">Status do Cliente</label>
          <select id="ativo_pessoa" formControlName="ativo_pessoa">
            <option value="S">Ativo</option>
            <option value="N">Inativo</option>
          </select>
        </div>
      </div>
  
      <div class="form-row">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" type="email" formControlName="email" placeholder="cliente@email.com" />
        </div>
  
        <div class="form-group">
          <label for="telefone">Telefone / Celular</label>
          <input 
            id="telefone" 
            type="text" 
            formControlName="telefone" 
            maxlength="11" 
            placeholder="DDD + Número (ex: 11999998888)" 
          />
        </div>
      </div>
  
      <button type="submit" [disabled]="cadastroForm.invalid" class="btn-salvar">
        Cadastrar Cliente
      </button>
    </form>
  </div>
